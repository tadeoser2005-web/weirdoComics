<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar producto | Weirdo Comics</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div class="logo">
            <span class="rojo">WEIRDO</span>
            <span class="blanco">COMICS</span>
        </div>
        <div class="rol">Admin</div>
        <nav>
            <a href="Inicio.html">Inicio</a>
            <a href="Ventas.html">Ventas</a>
            <a href="inventario.html" >Inventario</a>
            <a href="proveedores.html" >Proveedores</a>
            <a href="pedidos.html">Pedidos</a>
            <a href="reportes.html" >Reportes</a>
            <a href="usuarios.html" class="activo">Usuarios</a>
            <a href="roles.html">Roles y permisos</a>
        </nav>
        <a href="index.html" class="cerrar">Cerrar sesión</a>
    </aside>
    <main class="contenido">
        <h1>Editar Usuario</h1>
        <p class="subtitulo">Weirdo Comics · Sistema administrativo</p>

        <div class="detalle-grid">
            <div class="imagen-placeholder">IMAGEN</div>

            <form class="form-datos" action="usuarios.html" method="get" style="max-width:none">
                <label for="nombre">Nombre</label>
                <input class="campo" id="nombre" name="nombre" type="text"  value="Nombre usuario" required>

                <label for="correo">Correo electronico</label>
                <input class="campo" id="correo" name="correo" type="text" value="correo usuario" required>

                <label for="rol">Rol</label>
                <select class="selector" id="rol" name="rol"  required>
                    <option value="ventas">Ventas</option>
                    <option value="inventario/almacen">Inventario/almacen</option>
                    <option value="proveedores/pedidos">Proveedores/pedidos</option>
                    <option value="Reportes/usuarios">Reportes/usuarios</option>
                </select>

                <div class="botones">
                    <button class="btn" type="submit">Guardar</button>
                    <a class="btn" href="eliminar-usuario.html">Eliminar</a>
                    <a class="btn btn-oscuro" href="usuarios.html">Cancelar</a>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
