<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reportes - Weirdo Comics</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="layout">
    <aside id="sidebar" data-activo="Reportes"></aside>

    <main class="contenido">
      <h1>Reportes del Sistema</h1>
      <p class="subtitulo">Weirdo Comics · Sistema administrativo</p>

      <div class="stats">
        <div class="stat">
          <span class="etiqueta">Ventas Totales</span>
          <div class="valor">$84,250</div>
          <span class="detalle">Actualizado hoy</span>
        </div>
        <div class="stat">
          <span class="etiqueta">Productos Vendidos</span>
          <div class="valor">1,284</div>
          <span class="detalle">Unidades totales</span>
        </div>
        <div class="stat">
          <span class="etiqueta">Pedidos Realizados</span>
          <div class="valor">37</div>
          <span class="detalle">A proveedores</span>
        </div>
        <div class="stat">
          <span class="etiqueta">Clientes Atendidos</span>
          <div class="valor">312</div>
          <span class="detalle">Transacciones</span>
        </div>
      </div>
    </main>
  </div>

  <script src="assets/js/Sidebar.js"></script>
</body>
</html>
