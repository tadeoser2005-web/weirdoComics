<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos a Proveedores - Weirdo Comics</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="layout">
    <aside id="sidebar" data-activo="Pedidos"></aside>

    <main class="contenido">
      <h1>Pedidos a Proveedores</h1>
      <p class="subtitulo">Control de solicitudes de reabastecimiento</p>

      <div class="barra">
        <button class="btn" onclick="document.getElementById('modal-pedido').style.display='flex'">+ Levantar Pedido</button>
      </div>

      <div class="tabla-contenedor">
        <table class="tabla">
          <thead>
            <tr>
              <th>Código OC</th>
              <th>Proveedor</th>
              <th>Fecha Solicitud</th>
              <th>Estado</th>
              <th class="centro">Acción</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>OC-00124</td>
              <td>Comics Latam</td>
              <td>02/11/2026</td>
              <td><span class="estado estado-aviso">Pendiente</span></td>
              <td class="centro">
                <button class="btn btn-verde" style="padding: 8px 16px; font-size: 12px;">Confirmar Recepción</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Modal Levantar Pedido -->
      <div id="modal-pedido" class="modal-overlay" style="display: none;">
        <div class="confirmacion" style="max-width: 500px; text-align: left;">
          <h2 style="margin-bottom: 16px;">Nuevo pedido</h2>
          <form class="form-datos">
            <label>Proveedor</label>
            <select class="selector">
              <option>Seleccionar proveedor</option>
              <option>Comics Latam</option>
            </select>

            <label>Producto / Título</label>
            <input type="text" class="campo" placeholder="Ingresar producto" required>

            <label>Cantidad</label>
            <input type="number" class="campo" placeholder="Ingresar cantidad" required>

            <div class="botones" style="margin-top: 24px;">
              <button type="button" class="btn btn-gris" onclick="document.getElementById('modal-pedido').style.display='none'">Cancelar</button>
              <button type="submit" class="btn">Guardar pedido</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script src="assets/js/Sidebar.js"></script>
</body>
</html>
